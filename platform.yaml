api_version: lab/v1
name: lab-notebook
runtime: python-http
port: 8080
health_path: /health
resources: { cpu: 4, memory_mib: 512 }
scaling: { minimum: 0, maximum: 2 }
concurrency: 40
timeout_seconds: 60
exposure: authenticated
state: stateless
env:
  APP_TITLE: Lab Notebook
  LOG_LEVEL: info
  MAX_UPLOAD_MB: "10"
secrets: [API_KEY]
tests: required
needs:
  buckets: [uploads]
  topics: [events]
  database: postgres
  migrate: [alembic, upgrade, head]
reviewed: true
